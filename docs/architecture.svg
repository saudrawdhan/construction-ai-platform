<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">
    Construction Operations Intelligence Platform — Architecture
  </text>

  <!-- Browser -->
  <rect x="280" y="60" width="400" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Browser</text>
  <text x="480" y="102" text-anchor="middle" font-size="12.5" fill="#334155">React + TypeScript SPA · 16 operational areas</text>

  <!-- Browser -> API arrow -->
  <line x1="480" y1="114" x2="480" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="137" font-size="11.5" fill="#64748b">HTTPS · httpOnly-cookie JWT · RBAC</text>

  <!-- API container -->
  <rect x="60" y="150" width="840" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="176" font-size="14" font-weight="600" fill="#0f172a">FastAPI application</text>
  <text x="880" y="176" text-anchor="end" font-size="11.5" fill="#64748b">async SQLAlchemy · Pydantic · Alembic · Swagger</text>

  <!-- Layer band: routers / services / models -->
  <rect x="80" y="188" width="250" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="205" y="211" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Routers · api/v1</text>
  <text x="205" y="226" text-anchor="middle" font-size="11" fill="#64748b">thin, RBAC-guarded</text>

  <rect x="350" y="188" width="240" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="211" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Services</text>
  <text x="470" y="226" text-anchor="middle" font-size="11" fill="#64748b">business logic + data access</text>

  <rect x="610" y="188" width="270" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="745" y="211" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Models · Schemas</text>
  <text x="745" y="226" text-anchor="middle" font-size="11" fill="#64748b">ORM + API contracts</text>

  <!-- Security band -->
  <rect x="80" y="246" width="800" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="96" y="264" font-size="12.5" font-weight="600" fill="#991b1b">Security &amp; governance</text>
  <text x="96" y="280" font-size="11.5" fill="#7f1d1d">JWT + bcrypt · 7-role RBAC · rate limiting · security headers · audit log · human approval gate</text>

  <!-- AI band -->
  <rect x="80" y="300" width="800" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="96" y="320" font-size="12.5" font-weight="600" fill="#1e3a8a">AI layer  (no framework — own agent loop)</text>
  <text x="96" y="339" font-size="11.5" fill="#1e40af">LLM client: Gemini ⇄ Groq ⇄ OpenAI ⇄ local ⇄ mock (swap-by-env, retry/backoff)  ·  multilingual embeddings (e5, ONNX)</text>
  <text x="96" y="356" font-size="11.5" fill="#1e40af">Hybrid RAG: pgvector cosine + Postgres full-text, fused with Reciprocal Rank Fusion</text>
  <text x="96" y="373" font-size="11.5" fill="#1e40af">6 workflows · grounded copilot (refuses without evidence) · memory extractor · enterprise memory</text>

  <!-- API -> data arrows -->
  <line x1="340" y1="400" x2="340" y2="436" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="400" x2="685" y2="436" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data layer -->
  <rect x="150" y="436" width="380" height="66" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="462" text-anchor="middle" font-size="13.5" font-weight="600" fill="#166534">PostgreSQL 16 + pgvector</text>
  <text x="340" y="482" text-anchor="middle" font-size="11.5" fill="#15803d">41 tables · relational data + vectors · HNSW + GIN indexes</text>

  <rect x="560" y="436" width="250" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="685" y="462" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9a3412">Redis 7</text>
  <text x="685" y="482" text-anchor="middle" font-size="11.5" fill="#c2410c">arq job queue · rate-limit store</text>

  <!-- Worker -->
  <rect x="150" y="556" width="380" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="580" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">arq worker — scheduled automations</text>
  <text x="340" y="599" text-anchor="middle" font-size="11" fill="#64748b">daily digest · overdue-RFI · pending-PR · weekly report (cron, mock LLM)</text>

  <!-- Worker arrows -->
  <line x1="340" y1="556" x2="340" y2="504" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="572" x2="655" y2="504" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="840" y="600" text-anchor="end" font-size="11" fill="#94a3b8">Docker Compose · dev + production</text>
</svg>
