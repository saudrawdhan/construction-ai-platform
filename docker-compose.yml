name: construction-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: construction
      POSTGRES_DB: construction_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction -d construction_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://construction:construction@db:5432/construction_ai
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - models:/models
      - uploads:/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://construction:construction@db:5432/construction_ai
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
    env_file:
      - .env
    volumes:
      - ./backend:/code
      - models:/models
    command: arq app.worker.settings.WorkerSettings

volumes:
  pgdata:
  models:
  uploads:
